[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nusantara-alpha"
version = "0.1.0"
description = "Educational Indonesian equity prediction product for portfolio demonstration."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "streamlit>=1.36",
  "mlflow>=2.14",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "PyYAML>=6.0",
  "yfinance>=0.2.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ipykernel>=6.29",
  "jupyter>=1.1",
  "matplotlib>=3.9",
]

[project.scripts]
nusantara-ingest-yfinance = "ml.market_data.cli:main"
nusantara-promote-model = "model_registry.promote_candidate:main"

[tool.pytest.ini_options]
testpaths = [
  "tests/unit",
  "tests/contract",
  "tests/integration",
  "tests/ml_safety",
  "tests/deployment",
]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = [
  "app_streamlit*",
  "backend*",
  "ml*",
  "model_registry*",
  "storage*",
]
exclude = [
  "data*",
  "deployment*",
  "docs*",
  "specs*",
  "tests*",
]
