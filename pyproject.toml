[project]
name = "nusantara-alpha"
version = "0.1.0"
description = "Educational Indonesian equity prediction product for portfolio demonstration."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "streamlit>=1.36",
  "mlflow>=2.14",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = [
  "tests/unit",
  "tests/contract",
  "tests/integration",
  "tests/ml_safety",
  "tests/deployment",
]
pythonpath = ["."]

